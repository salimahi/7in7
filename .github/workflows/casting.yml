name: Casting call

# Triggered by the Railway service (write7in7-webhook) via repository_dispatch:
#   casting-new  -> render the graphic, add the call, point /casting at its form
#   casting-sync -> recompute the redirect only (e.g. revert after the recording date)
# Commits straight to main (requires the Actions bot to be allowed to push to main).
on:
  repository_dispatch:
    types: [casting-new, casting-sync]
  workflow_dispatch:
    inputs:
      data:
        description: 'Casting call JSON {script,date,times,link}, or empty to just re-sync'
        required: false

permissions:
  contents: write

concurrency:
  group: casting
  cancel-in-progress: false

jobs:
  casting:
    runs-on: ubuntu-latest
    env:
      DATA: ${{ github.event.client_payload.data || github.event.inputs.data }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write payload
        run: |
          if [ -n "$DATA" ]; then printf '%s' "$DATA" > "$RUNNER_TEMP/data.json"; fi
      - name: Install Playwright
        if: ${{ env.DATA != '' }}
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Install ffmpeg (for the story MP4)
        if: ${{ env.DATA != '' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render graphic
        if: ${{ env.DATA != '' }}
        run: |
          IMG=$(node tools/render-casting.js "$RUNNER_TEMP/data.json" | tail -n 1)
          node -e "const f=process.argv[1],d=require(f);d.image=process.argv[2];require('fs').writeFileSync(f,JSON.stringify(d))" "$RUNNER_TEMP/data.json" "$IMG"
      - name: Update calls and redirect
        run: |
          if [ -f "$RUNNER_TEMP/data.json" ]; then
            node tools/casting-sync.js --add "$RUNNER_TEMP/data.json"
          else
            node tools/casting-sync.js
          fi
      - name: Commit
        run: |
          git config user.name "write7in7-bot"
          git config user.email "contact@write7in7.com"
          git add casting img/casting
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Casting call update (${{ github.event_name }})"
          git pull --rebase origin main
          git push origin HEAD:main
