  <style>
    /* Prompts-specific styles */
    .prompt-current {
      background: rgba(180, 154, 66, 0.05);
      border: 1px solid rgba(180, 154, 66, 0.35);
      border-radius: var(--radius);
      padding: 3rem;
      position: relative;
      overflow: hidden;
    }

    .prompt-current::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(180, 154, 66, 0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .prompt-cycle-label {
      font-family: 'Geist Mono', monospace;
      font-size: 0.67rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 0.5rem;
    }

    .prompt-month {
      font-family: 'Cormorant', serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 500;
      color: var(--dark);
      margin-bottom: 1.5rem;
    }

    .prompt-thumbnail {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .prompt-text {
      font-family: 'Geist Mono', monospace;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .prompt-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 2rem;
    }

    .prompt-meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .prompt-meta-item strong { color: var(--text); }

    .prompt-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 100px;
      white-space: nowrap;
    }

    .prompt-status::before { content: '●'; font-size: 0.55rem; }

    .prompt-status.open {
      background: rgba(180, 154, 66, 0.1);
      color: var(--gold-dark);
      border: 1px solid var(--gold);
    }

    .prompt-status.closed {
      background: rgba(107, 99, 82, 0.07);
      color: var(--text-muted);
      border: 1px solid rgba(107, 99, 82, 0.18);
    }

    .prompt-status.upcoming {
      background: rgba(140, 103, 55, 0.15);
      color: var(--gold-light);
      border: 1px solid rgba(140, 103, 55, 0.35);
    }

    .prompt-cta-text {
      font-family: 'Geist Mono', monospace;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.6;
    }

    .prompt-type-badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 100px;
      background: rgba(122, 92, 168, 0.1);
      color: var(--purple-light);
      border: 1px solid rgba(122, 92, 168, 0.35);
      white-space: nowrap;
    }

    /* Archive */
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-top: 2.5rem;
    }

    .archive-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: clamp(1.75rem, 2vw + 1.25rem, 2.75rem);
      transition: border-color var(--transition), transform var(--transition);
    }

    .archive-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .archive-card-header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .archive-card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .archive-month {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .archive-thumbnail {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: calc(var(--radius) - 4px);
      margin-bottom: 1.25rem;
    }

    .archive-prompt {
      font-family: 'Cormorant', serif;
      font-style: italic;
      font-size: clamp(1.2rem, 1vw + 1rem, 1.6rem);
      font-weight: 500;
      color: var(--dark);
      line-height: 1.35;
      margin-bottom: 1.25rem;
    }

    /* Winners */
    .archive-winners {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      border-top: 1px solid var(--card-border);
      padding-top: 1rem;
    }

    .winner-graphic {
      display: block;
      width: 100%;
      border-radius: calc(var(--radius) - 4px);
      margin-bottom: 0.85rem;
    }

    .winner-row {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      font-size: clamp(0.85rem, 0.4vw + 0.75rem, 1.05rem);
    }

    .winner-place {
      font-weight: 700;
      font-size: clamp(0.7rem, 0.3vw + 0.6rem, 0.85rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      min-width: 32px;
      flex-shrink: 0;
    }

    .winner-row:nth-child(1) .winner-place { color: var(--gold-light); }
    .winner-row:nth-child(2) .winner-place { color: var(--text-muted); }
    .winner-row:nth-child(3) .winner-place { color: #a0785a; }

    .winner-name {
      color: var(--text-muted);
    }

    .winner-name strong { color: var(--purple-light); }

    .empty-archive {
      text-align: center;
      padding: 3.5rem 2rem;
      border: 1px dashed var(--card-border);
      border-radius: var(--radius);
      color: var(--text-muted);
      margin-top: 2.5rem;
    }

    .empty-archive p { font-size: 0.95rem; margin-top: 0.5rem; }

    /* Late entry callout */
    .late-entry-callout {
      text-align: center;
    }

    .late-entry-options {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .late-entry-option {
      background: transparent;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem 1.75rem;
      position: relative;
    }

    .late-entry-option.featured {
      border-color: var(--gold);
      background: rgba(180, 154, 66, 0.06);
    }

    .late-entry-option.featured::before {
      content: 'BEST VALUE';
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Geist Mono', monospace;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      background: var(--gold);
      color: var(--dark);
      padding: 0.2rem 0.9rem;
      border-radius: 2px;
    }

    @media (max-width: 640px) {
      .prompt-current { padding: 2rem 1.5rem; }
      .prompt-meta { flex-direction: column; gap: 0.75rem; align-items: flex-start; }
      .late-entry-options { flex-direction: column; align-items: center; }
    }
  </style>
